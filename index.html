<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Browser NES carts by Motch.">
<title>MotchSpace</title>
<style>
  /* The same palette the carts draw with: $0F black, $00 grey, $10 light grey,
     $30 white, $29 snake green. Square corners, lit top edges. */
  :root{
    --black:#000; --white:#F8F8F8; --grey:#BCBCBC; --dim:#7C7C7C;
    --green:#B8F818; --gold:#F8B800; --red:#E45C10;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--black);color:var(--grey);
    font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:0 max(12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
             max(12px,env(safe-area-inset-left));
  }
  header{
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    padding:16px 0 12px;border-bottom:2px solid var(--dim);
  }
  h1{margin:0;font-size:16px;letter-spacing:.2em;color:var(--green)}
  h1 b{color:var(--white);font-weight:700}
  header .count{color:var(--dim);font-size:11px;letter-spacing:.14em}
  header a{margin-left:auto;color:var(--gold);text-decoration:none;font-size:13px;letter-spacing:.1em}
  header a:hover{color:var(--white)}
  main{padding-top:18px}
  .grid{
    display:grid;gap:14px;margin:0;padding:0;list-style:none;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  }
  @media (max-width:430px){ .grid{grid-template-columns:1fr} }
  .grid a{
    display:block;text-decoration:none;color:inherit;height:100%;
    background:var(--black);border:2px solid var(--dim);border-top-color:var(--grey);
  }
  .grid a:hover,.grid a:focus{outline:none;border-color:var(--green)}
  .grid a:hover h2,.grid a:focus h2{color:var(--green)}
  .grid img{
    display:block;width:100%;aspect-ratio:256/240;object-fit:cover;
    background:var(--black);border-bottom:2px solid var(--dim);
  }
  .grid .none{
    aspect-ratio:256/240;display:grid;place-items:center;
    background:var(--black);border-bottom:2px solid var(--dim);
    color:var(--dim);font-size:32px;letter-spacing:.2em;
  }
  .grid h2{margin:0;padding:10px 12px 0;font-size:13px;letter-spacing:.1em;color:var(--white)}
  .grid p{margin:5px 12px 12px;font-size:12px;line-height:1.5;color:var(--dim)}
  .note{margin:18px 0 0;font-size:12px;color:var(--dim)}
  .note code{color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>MOTCH<b>.SPACE</b></h1>
  <span class="count" id="count"></span>
  <a href="scores.html">Scores + comments</a>
</header>
<main>
  <ul class="grid" id="grid"></ul>
  <p class="note" id="empty" hidden>
    No carts found. Drop an <code>.html</code> with a <code>&lt;canvas&gt;</code> in this
    folder and run <code>node build.js</code>.
  </p>
</main>
<script src="games.js"></script>
<script>
(() => {
'use strict'
const grid = document.getElementById('grid')
const games = window.GAMES || []

document.getElementById('count').textContent =
  games.length ? games.length + (games.length === 1 ? ' cart' : ' carts') : ''

if (!games.length) {
  document.getElementById('empty').hidden = false
  return
}

for (const g of games) {
  const a = document.createElement('a')
  a.href = g.file

  if (g.thumb) {
    const img = document.createElement('img')
    img.src = g.thumb
    img.alt = ''                      // the title right below already names it
    img.loading = 'lazy'
    a.append(img)
  } else {
    const blank = document.createElement('div')
    blank.className = 'none'
    blank.textContent = '?'
    a.append(blank)
  }

  const h2 = document.createElement('h2')
  h2.textContent = g.title
  a.append(h2)

  if (g.description) {
    const p = document.createElement('p')
    p.textContent = g.description
    a.append(p)
  }

  const li = document.createElement('li')
  li.append(a)
  grid.append(li)
}
})()
</script>
</body>
</html>
