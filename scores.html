<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MotchSpace &middot; Scores</title>
<style>
  /* Drawn from the cart's own NES master palette: $0F black, $00 grey, $10 light grey,
     $30 white, $29 snake green, $28 gold, $17 orange. Square corners, lit top edges -
     the same rules the wall and stone tiles follow on the canvas. */
  :root{
    --black:#000; --white:#F8F8F8; --grey:#BCBCBC; --dim:#7C7C7C;
    --green:#B8F818; --gold:#F8B800; --red:#E45C10;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--black);color:var(--grey);
    font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:0 max(12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom))
             max(12px,env(safe-area-inset-left));
  }
  header{
    position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:12px 0;background:var(--black);border-bottom:2px solid var(--dim);
    box-shadow:0 2px 0 var(--black);
  }
  h1{margin:0;font-size:14px;letter-spacing:.16em;color:var(--green);text-transform:uppercase}
  h1 span{color:var(--dim);font-weight:400;letter-spacing:.06em}
  .jump{margin-left:auto;display:flex;gap:8px;flex:none}
  .back{
    color:var(--gold);text-decoration:none;font-size:13px;
    letter-spacing:.1em;border:2px solid var(--dim);padding:7px 11px;
  }
  .back:hover{border-color:var(--gold)}
  main{display:grid;gap:34px;padding-top:18px}
  .board > h2.game{
    margin:0 0 12px;font-size:13px;letter-spacing:.2em;color:var(--white);
    padding-bottom:8px;border-bottom:2px solid var(--dim);
  }
  .board > h2.game a{color:var(--gold);text-decoration:none;font-size:11px;letter-spacing:.1em;float:right}
  .board > h2.game a:hover{color:var(--white)}
  .cols{display:grid;gap:22px}
  @media (orientation:landscape),(min-width:760px){
    .cols{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:26px;align-items:start}
    header{padding:8px 0}
  }
  section{min-width:0}
  h3{margin:0 0 10px;font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
  h3::before{content:'\25B8';color:var(--green);margin-right:8px}
  ol,ul{margin:0;padding:0;list-style:none}
  .card{
    background:var(--black);border:2px solid var(--dim);border-top-color:var(--grey);
    padding:10px 12px;margin-bottom:8px;overflow-wrap:anywhere;
  }
  .row{display:flex;align-items:baseline;gap:10px}
  .row .n{flex:none;width:1.8em;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
  .row .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--white)}
  .row .mode{margin-left:auto;flex:none;color:var(--dim);font-size:11px}
  .row .sc{flex:none;color:var(--green);font-variant-numeric:tabular-nums}
  .meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:5px}
  .meta .who{font-weight:700;color:var(--white)}
  .badge{
    flex:none;background:var(--black);border:1px solid var(--dim);
    padding:1px 6px;font-size:11px;color:var(--gold);
  }
  .when{margin-left:auto;color:var(--dim);font-size:11px}
  .body{margin:0;white-space:pre-wrap}
  form{
    display:grid;gap:10px;background:var(--black);border:2px solid var(--dim);
    border-top-color:var(--grey);padding:12px;margin-bottom:14px;
  }
  label{display:grid;gap:4px;font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
  input,textarea,select,button{
    width:100%;font:inherit;color:var(--white);background:var(--black);
    border:2px solid var(--dim);padding:9px 10px;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green)}
  textarea{resize:vertical;min-height:72px}
  button{background:var(--green);border-color:var(--green);color:var(--black);font-weight:700;
    letter-spacing:.12em;cursor:pointer}
  button:hover:not(:disabled){background:var(--white);border-color:var(--white)}
  button:disabled{background:var(--black);border-color:var(--dim);color:var(--dim);cursor:not-allowed}
  .note{margin:0;font-size:12px;color:var(--dim)}
  .note.bad{color:var(--red)}
</style>
</head>
<body>
<header>
  <h1>Scores<span> &middot; comments</span></h1>
  <nav class="jump" id="jump"></nav>
  <a class="back" href="index.html">Carts</a>
</header>
<main id="boards"></main>
<script>
(() => {
'use strict'
// Fill these in from Supabase > Project Settings > API. The anon key is meant to be
// public: the row-level security policies, not this file, are what stop abuse.
const SB   = 'https://iwiddxnkwwocoooenpsp.supabase.co/rest/v1/'
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml3aWRkeG5rd3dvY29vb2VucHNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MjU4NzMsImV4cCI6MjEwNTIwMTg3M30.TJoPI1Zu_cUITkpIKVhID-l18MbVc6AVqEibLgBIwGU'
const H    = {apikey: ANON, Authorization: 'Bearer ' + ANON}

const $ = s => document.querySelector(s)
const el = (tag, cls, text) => {          // build nodes, never innerHTML: names and
  const n = document.createElement(tag)   // comments are untrusted input
  if (cls) n.className = cls
  if (text != null) n.textContent = text
  return n
}
const store = {                            // localStorage throws in private mode
  get: k => { try { return localStorage.getItem(k) } catch { return null } },
  set: (k, v) => { try { localStorage.setItem(k, v) } catch {} }
}
const read = (key, fallback) => { try { return JSON.parse(store.get(key) || 'null') ?? fallback } catch { return fallback } }

const ago = t => {
  const s = (Date.now() - new Date(t)) / 1000
  if (s < 60) return 'just now'
  if (s < 3600) return Math.floor(s / 60) + 'm ago'
  if (s < 86400) return Math.floor(s / 3600) + 'h ago'
  return Math.floor(s / 86400) + 'd ago'
}

// Each cart writes its own save under its own key, and each board reads only its own rows out of
// the shared table. The mode column is the fence between boards: Snake writes one of its four mode
// names, Galactica a stage, Tetro a level. Change the filters together with the carts or the
// boards start showing each other's runs.
const BOARDS = [
  {
    key: 'snake', title: 'Snake', game: 'snake.html', filter: '&mode=in.(CLASSIC,WRAP,MAZE,SPRINT)',
    runs(){
      const run = read('snakeRun'), tops = read('snakeTops', {}) || {}, out = []
      if (run && run.score >= 1) {
        out.push({label: 'LAST RUN - ' + run.mode, score: run.score, mode: run.mode})
        if ((tops[run.mode] | 0) > run.score)
          out.push({label: 'BEST - ' + run.mode, score: tops[run.mode], mode: run.mode})
      } else {
        for (const mode of Object.keys(tops))
          if ((tops[mode] | 0) >= 1) out.push({label: 'BEST - ' + mode, score: tops[mode], mode})
      }
      return out.sort((a, b) => b.score - a.score)
    }
  },
  {
    key: 'galactica', title: 'Galactica', game: 'galactica.html', filter: '&mode=like.STAGE*',
    runs(){
      const run = read('galacticaRun'), top = read('galacticaTop', {score: 0, stage: 1}) || {score: 0, stage: 1}
      const out = []
      if (run && run.score >= 1) {
        out.push({label: 'LAST RUN - STAGE ' + run.stage, score: run.score, mode: 'STAGE ' + run.stage})
        if ((top.score | 0) > run.score)
          out.push({label: 'BEST - STAGE ' + top.stage, score: top.score, mode: 'STAGE ' + top.stage})
      } else if ((top.score | 0) >= 1) {
        out.push({label: 'BEST - STAGE ' + top.stage, score: top.score, mode: 'STAGE ' + top.stage})
      }
      return out
    }
  },
  {
    key: 'tetro', title: 'Tetro', game: 'tetro.html', filter: '&mode=like.LEVEL*',
    runs(){
      const run = read('tetroRun'), top = read('tetroTop', {score: 0, level: 1}) || {score: 0, level: 1}
      const out = []
      if (run && run.score >= 1) {
        out.push({label: 'LAST RUN - LEVEL ' + run.level, score: run.score, mode: 'LEVEL ' + run.level})
        if ((top.score | 0) > run.score)
          out.push({label: 'BEST - LEVEL ' + top.level, score: top.score, mode: 'LEVEL ' + top.level})
      } else if ((top.score | 0) >= 1) {
        out.push({label: 'BEST - LEVEL ' + top.level, score: top.score, mode: 'LEVEL ' + top.level})
      }
      return out.sort((a, b) => b.score - a.score)
    }
  }
]

for (const b of BOARDS) {
  const a = el('a', 'back', b.title)
  a.href = '#' + b.key
  $('#jump').append(a)

  const board = el('section', 'board')
  board.id = b.key
  const h = el('h2', 'game', b.title.toUpperCase())
  const play = el('a', null, 'Play \u25B8')
  play.href = b.game
  h.append(play)
  board.append(h)

  const cols = el('div', 'cols')
  const topSec = el('section')
  topSec.append(el('h3', null, 'Top runs'))
  const ol = el('ol', 'top')
  ol.append(el('li', 'card note', 'Loading\u2026'))
  topSec.append(ol)
  const feedSec = el('section')
  feedSec.append(el('h3', null, 'Comments'))
  const form = el('form', 'post')
  const l1 = el('label', null, 'Score to attach'); const sel = el('select', 'run')
  l1.append(sel)
  const l2 = el('label', null, 'Name'); const name = el('input', 'name')
  name.maxLength = 16; name.autocomplete = 'nickname'; name.required = true
  l2.append(name)
  const l3 = el('label', null, 'Comment (optional)'); const body = el('textarea', 'body')
  body.maxLength = 400
  l3.append(body)
  const send = el('button', 'send', 'Post'); send.type = 'submit'
  const msg = el('p', 'note msg')
  form.append(l1, l2, l3, send, msg)
  const ul = el('ul', 'feed')
  ul.append(el('li', 'card note', 'Loading\u2026'))
  feedSec.append(form, ul)
  cols.append(topSec, feedSec)
  board.append(cols)
  $('#boards').append(board)

  b.dom = {form, sel, name, body, send, msg, ol, ul}
}

const note = (b, t, bad) => { const m = b.dom.msg; m.textContent = t; m.className = bad ? 'note bad' : 'note msg' }

function fillRuns(b){
  const runs = b.runs()
  b.dom.sel.textContent = ''
  if (!runs.length) {
    b.dom.send.disabled = true
    note(b, 'Play a round first - your score comes from the game, not from this form.', true)
    return
  }
  b.dom.send.disabled = false
  for (const r of runs) {
    const o = el('option', null, r.label + '  -  ' + r.score)
    o.value = JSON.stringify({score: r.score, mode: r.mode})
    b.dom.sel.append(o)
  }
}

function drawTop(b, rows){
  const ol = b.dom.ol; ol.textContent = ''
  if (!rows.length) { ol.append(el('li', 'card note', 'No runs posted yet.')); return }
  rows.forEach((r, i) => {
    const row = el('div', 'row')
    row.append(el('span', 'n', String(i + 1)))
    row.append(el('span', 'who', r.name))
    row.append(el('span', 'mode', r.mode))
    row.append(el('span', 'sc', String(r.score)))
    const li = el('li', 'card')
    li.append(row)
    ol.append(li)
  })
}

function drawFeed(b, rows){
  const ul = b.dom.ul; ul.textContent = ''
  if (!rows.length) { ul.append(el('li', 'card note', 'No comments yet. Be the first.')); return }
  for (const r of rows) {
    const meta = el('div', 'meta')
    meta.append(el('span', 'who', r.name))
    meta.append(el('span', 'badge', r.score + ' ' + r.mode))
    meta.append(el('span', 'when', ago(r.created_at)))
    const li = el('li', 'card')
    li.append(meta)
    if (r.body) li.append(el('p', 'body', r.body))   // a score can go up with no comment
    ul.append(li)
  }
}

async function load(b){
  const get = q => fetch(SB + '/board?approved=eq.true' + b.filter + '&' + q, {headers: H})
    .then(r => { if (!r.ok) throw Error('HTTP ' + r.status); return r.json() })
  try {
    const [top, feed] = await Promise.all([
      get('select=name,score,mode&order=score.desc&limit=10'),
      get('select=name,body,score,mode,created_at&order=created_at.desc&limit=25')])
    drawTop(b, top); drawFeed(b, feed)
  } catch (err) {
    const bad = el('li', 'card note bad', 'Could not load the board: ' + err.message)
    for (const node of [b.dom.ol, b.dom.ul]) { node.textContent = ''; node.append(bad.cloneNode(true)) }
  }
  fillRuns(b)
}

for (const b of BOARDS) {
  b.dom.form.addEventListener('submit', async e => {
    e.preventDefault()
    let run
    try { run = JSON.parse(b.dom.sel.value) } catch { return note(b, 'Pick a score to attach.', true) }
    const name = b.dom.name.value.trim(), text = b.dom.body.value.trim()
    if (!name) return note(b, 'A name, please.', true)
    const btn = b.dom.send; btn.disabled = true; note(b, 'Posting\u2026')
    try {
      const res = await fetch(SB + '/board', {
        method: 'POST',
        headers: Object.assign({'Content-Type': 'application/json', Prefer: 'return=minimal'}, H),
        body: JSON.stringify([{name, body: text || null, score: run.score, mode: run.mode}])})
      if (!res.ok) throw Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 120))
      b.dom.body.value = ''
      store.set('boardName', name)                // so posting after a run is one field shorter
      note(b, 'Posted. It is live on the board.')
    } catch (err) {
      note(b, 'Could not post: ' + err.message, true)
    }
    btn.disabled = false
  })
  b.dom.name.value = store.get('boardName') || ''
  load(b)
}

window.BOARD = {BOARDS, ago, load}         // console handle, same idea as window.NES
})()
</script>
</body>
</html>
