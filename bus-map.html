// minimal protobuf reader: {field: [values]}; nested messages stay as bytes
function pb(buf) {
  const out = {}; let i = 0;
  const varint = () => { let n = 0, m = 1, b; do { b = buf[i++]; n += (b & 0x7f) * m; m *= 128; } while (b >= 0x80); return n; };
  while (i < buf.length) {
    const key = varint(), wire = key % 8, field = Math.floor(key / 8); let v;
    if (wire === 0) v = varint();
    else if (wire === 1 || wire === 5) { const n = wire === 1 ? 8 : 4; v = buf.subarray(i, i + n); i += n; }
    else if (wire === 2) { const n = varint(); v = buf.subarray(i, i + n); i += n; }
    else throw new Error("protobuf wire type " + wire);
    (out[field] = out[field] || []).push(v);
  }
  return out;
}
const f32 = b => new DataView(b.buffer, b.byteOffset, 4).getFloat32(0, true);
const text = b => new TextDecoder().decode(b);

// in-service buses (they have a trip) inside BOX, reported in the last 5 minutes
function parseBuses(bytes) {
  const feed = pb(bytes), now = feed[1] ? (pb(feed[1][0])[3] || [Date.now() / 1000])[0] : Date.now() / 1000;
  const [s, w, n, e] = BOX, buses = [];
  for (const raw of feed[2] || []) {
    const ent = pb(raw); if (!ent[4]) continue;
    const v = pb(ent[4][0]); if (!v[1] || !v[2]) continue;
    const route = text((pb(v[1][0])[5] || [new Uint8Array()])[0]);
    const pos = pb(v[2][0]), lat = f32(pos[1][0]), lon = f32(pos[2][0]);
    const age = now - (v[5] || [now])[0];
    if (!route || !(s < lat && lat < n && w < lon && lon < e) || age > 300) continue;
    const veh = v[8] ? pb(v[8][0]) : {};
    buses.push({route, lat, lon, id: text((veh[2] || veh[1] || [new Uint8Array()])[0]).slice(-3),
                kmh: pos[5] ? Math.round(f32(pos[5][0]) * 3.6) : null,
                bearing: pos[3] ? Math.round(f32(pos[3][0])) : null});
  }
  return buses;
}

const compass = d => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(d / 45) % 8];
const $ = id => document.getElementById(id);
const statusEl = $("status"), note = $("note");
const map = L.map("map").setView([46.52, -84.33], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &middot; Transit data: Sault Ste. Marie Transit'}).addTo(map);

// route lines: grey, the chosen route bright; choose with a chip, a bus or a line
let hot = "";
const polys = {};
const style = r => r === hot ? {color: "#f0f0f0", weight: 4, opacity: 1}
                             : {color: "#8a8a8a", weight: 2, opacity: hot ? .2 : .6};
function choose(r) {
  hot = hot === r ? "" : r;
  for (const [k, ps] of Object.entries(polys)) ps.forEach(p => { p.setStyle(style(k)); if (k === hot) p.bringToFront(); });
  for (const b of $("chips").children) b.setAttribute("aria-pressed", b.dataset.r === hot);
  draw();
}
const all = [];
for (const [r, info] of Object.entries(ROUTES)) {
  polys[r] = info.lines.map(line => L.polyline(line, style(r)).bindPopup("Route " + r + " &middot; " + info.name)
    .on("click", () => choose(r)).addTo(map));
  all.push(...info.lines.flat());
  const b = document.createElement("button"); b.dataset.r = r; b.setAttribute("aria-pressed", "false");
  b.textContent = r + " " + info.name; b.onclick = () => choose(r); $("chips").appendChild(b);
}
if (all.length) map.fitBounds(all, {padding: [20, 20]});

const layer = L.layerGroup().addTo(map);
let buses = [], shownAt = 0, timer = 0, fitted = false;
function draw() {
  layer.clearLayers();
  const pick = hot ? buses.filter(b => b.route === hot) : buses;
  for (const b of pick) {
    const name = (ROUTES[b.route] || {}).name;
    const arrow = b.bearing != null ? '<i style="transform:rotate(' + b.bearing + 'deg)"></i>' : "";
    L.marker([b.lat, b.lon], {title: "Route " + b.route, icon: L.divIcon({className: "", iconSize: [26, 22],
      html: '<div class="bus">' + b.route + arrow + "</div>"})})
      .bindPopup("Route " + b.route + (name ? " " + name : "") + (b.id ? " &middot; bus " + b.id : "")
                 + (b.bearing != null ? "<br>heading " + compass(b.bearing) : "")
                 + (b.kmh != null ? " &middot; " + b.kmh + " km/h" : ""))
      .on("click", () => { if (hot !== b.route) choose(b.route); }).addTo(layer);
  }
  statusEl.dataset.count = pick.length + (hot ? " ON ROUTE " + hot : " BUSES");
  tick();
}
function tick() {
  if (!shownAt) return;
  const s = Math.round((Date.now() - shownAt) / 1000);
  statusEl.textContent = statusEl.dataset.count + " · " + (s < 5 ? "NOW" : s + "S AGO");
  statusEl.classList.toggle("stale", s > 30);
}
async function load() {
  clearTimeout(timer);
  if (document.hidden) return;  // resumes on visibilitychange
  try {
    const r = await fetch(FEED, {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    buses = parseBuses(new Uint8Array(await r.arrayBuffer()));
    shownAt = Date.now(); note.textContent = ""; draw();
    if (!fitted && buses.length) { map.fitBounds(buses.map(b => [b.lat, b.lon]), {padding: [40, 40], maxZoom: 14}); fitted = true; }
    if (!buses.length) note.textContent = "No buses running right now.";
  } catch (err) {
    statusEl.textContent = "FEED UNAVAILABLE"; statusEl.classList.add("stale");
    if (!shownAt) note.textContent = "Live bus positions are unavailable right now.";
  }
  timer = setTimeout(load, REFRESH_MS);
}
setInterval(tick, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
load();
